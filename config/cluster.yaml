# Cluster run on the IE Sci-Tech Slurm cluster (see cluster/README.md). Same keys as local.yaml.
# Spark runs local[N] inside one Slurm job; there is no HDFS, YARN or PostgreSQL server.
# Submit with cluster/parse.sbatch; the month list is its argument (--months overrides `months`).
env: cluster

months: ["2026-08", "2026-09", "2026-10"]  # default list; each job usually passes its own with --months

input:
  # Decompressed monthly dumps (Hadoop can't split .zst): zstd -dc dump.pgn.zst > {data_dir}/raw/lichess_{month}.pgn
  # The Part 1 sample is data/raw/lichess_{month}_sample.pgn: pass it with --pgn-pattern.
  pgn_pattern: "{data_dir}/raw/lichess_{month}.pgn"
  sample_lines: null  # full months

paths:
  # Base folder for all data. Relative = from the repo root. Change this one line once the
  # admins confirm where large data should live (the home folder is a shared network drive).
  data_dir: data
  lake_dir: "{data_dir}/lake"
  profiles_dir: "{data_dir}/raw/profiles"
  processed_dir: "{data_dir}/processed"
  log_dir: logs  # step logs stay in the repo, next to the Slurm job output

spark:
  # auto = taken from the Slurm job (src/common/spark.py); fails outside a job, e.g. on rust
  master: auto              # local[N], N = $SLURM_CPUS_PER_TASK
  driver_memory: auto       # 75% of the job's --mem; with spark-submit the sbatch passes --driver-memory
  shuffle_partitions: auto  # 3 x N
  # Only requested by steps that use Spark JDBC (load_postgres.py)
  jars_packages: org.postgresql:postgresql:42.7.4

postgres:
  # Placeholder: the cluster has no PostgreSQL server. Don't run the load_* steps here yet.
  host: TBD
  port: 5432
  dbname: chess
  # Credentials come from PGUSER / PGPASSWORD in .env
  load_moves: false  # moves stay in Parquet on the cluster
  jdbc_batch_size: 10000

lichess:
  users_url: https://lichess.org/api/users
  batch_size: 300
  retry_wait_s: 60
  max_tries: 3
  user_agent: "chess-cheat-detector/0.1 (IE University student project; github.com/SantiLandinezUni/chess-cheat-detector)"

quality:
  elo_min: 400
  elo_max: 3500
  min_move_time_s: -1.0
  max_share_no_clock: 0.05
