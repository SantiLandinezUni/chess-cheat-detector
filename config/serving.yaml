# Serving layer and dashboard (workstream E2).
# Paths point at small result files: start with the ones built from the Part 1 sample,
# then switch to the full-data files Santi sends. A missing file is skipped with a warning.

postgres:
  # Overridden by the SERVING_DB_URL environment variable if it is set.
  url: postgresql+psycopg2://localhost:5432/chess

live_scores:
  # Required: the load stops with an error if this file is missing.
  # serving_v2: the full day of 2026-10-22 scored with the final baselines (lake/baselines).
  # run_id comes from the file (e.g. 38028-day2026-10-22-nopacing-c4); this value is only a fallback.
  path: data/serving/serving_v2/scores_live_game_2026-10-22.parquet
  run_id: oct22-full-day

# Move-by-move running scores of about 1,000 games (game_key, ply, color, score). Optional.
# The file has no run_id: its rows get the run_id of the live scores above.
running_scores:
  path: data/serving/serving_v2/score_timeline_sample_2026-10-22.parquet

# Optional tables: loaded as-is (same columns as the data dictionary) into serving.<table>.
optional_tables:
  baselines: data/serving/serving_v2/baselines.parquet  # L10, final baselines (lake/baselines)
  player_anomaly: data/serving/anomaly_player.parquet # L11
  labels_summary: data/serving/labels_summary.csv     # workstream C
  model_results: data/serving/model_results.csv       # workstream D

dashboard:
  high_risk_threshold: 1.0   # risk_score at or above this is shown as "high risk"
  top_n_games: 50
