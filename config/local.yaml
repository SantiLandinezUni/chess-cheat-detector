# Local run on a MacBook (Apple Silicon, 8 GB RAM).
# Relative paths are resolved from the repo root. Secrets live in .env, never here.
env: local

months: ["2026-09"]

input:
  # {month} is replaced with each entry of `months`
  pgn_pattern: data/raw/lichess_{month}_sample.pgn
  # The sample is the first N lines of the dump (see SETUP.md step 5): 124,914 games
  sample_lines: 2500000
  # Chunked parse of a full .pgn.zst dump (src/ingestion/parse_chunked.py, used on the cluster)
  zst_pattern: data/raw/lichess_db_standard_rated_{month}.pgn.zst
  chunk_gb: 20

paths:
  lake_dir: data/lake
  profiles_dir: data/raw/profiles
  processed_dir: data/processed
  # Baselines the streaming scorer (src/streaming/scorer.py) compares live games with: level "game"
  # rows with the layout of lake/baselines (data dictionary L10). Provisional table from
  # src/streaming/baselines_provisional.py until workstream B's table runs on the full data; then
  # switch to data/lake/baselines (config change only).
  scorer_baselines_dir: data/lake/baselines_provisional
  # Final per-game scores of the streaming scorer (one Parquet folder per run_id, hashed ids only)
  live_scores_dir: data/lake/scores/live_game
  log_dir: logs

spark:
  master: local[4]
  # Only takes effect if the JVM isn't running yet. With spark-submit, also pass
  # --driver-memory 3g on the command line.
  driver_memory: 3g
  shuffle_partitions: 8
  # Same as driver_memory: with spark-submit, pass --packages org.postgresql:postgresql:42.7.4
  jars_packages: org.postgresql:postgresql:42.7.4

postgres:
  host: localhost
  port: 5432
  dbname: chess
  # User and password come from PGUSER / PGPASSWORD in .env.
  # If PGUSER is empty, your Mac username is used (Homebrew default, no password).
  load_moves: true
  jdbc_batch_size: 10000

lichess:
  users_url: https://lichess.org/api/users
  batch_size: 300
  retry_wait_s: 60
  max_tries: 3
  user_agent: "chess-cheat-detector/0.1 (IE University student project; github.com/SantiLandinezUni/chess-cheat-detector)"

quality:
  elo_min: 400
  elo_max: 3500
  min_move_time_s: -1.0
  max_share_no_clock: 0.05
